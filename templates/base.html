<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Academic Advisor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a href="{{ url_for('index') }}" class="brand">Academic Advisor</a>
      <span class="sub">CSC 303 · AI + Software Engineering</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">
    Model: {{ meta.model_name }} · test accuracy {{ '%.0f'|format(meta.test_accuracy * 100) }}% ·
    trained on Google Colab · served with Flask
  </footer>
</body>
</html>
